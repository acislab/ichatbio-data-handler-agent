[project]
name = "ichatbio-data-handler-agent"
version = "1"
requires-python = ">=3.12"
dependencies = [
    "ichatbio-sdk==0.2.8",
    "openai>=1.109.1",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.16.0",
    "instructor>=1.11.3",
    "python-dotenv>=1.2.4",
    "starlette>=0.47.3",
    "uvicorn>=0.34.3",
    "genson>=1.3.0",
    "jq>=1.10.0",
    "langchain>=1.3.4",
    "langchain_openai>=1.2.2",
    "filetype>=1.2.0",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "pytest_httpx>=0.36.2",
    "black>=26.3.0",
    "ruff>=0.15.4",
]

[tool.pytest.ini_options]
pythonpath = ["src", "tests"]
log_cli = true
log_cli_level = "INFO"
